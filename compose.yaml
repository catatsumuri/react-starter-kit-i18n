services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        labels:
            com.example.observability.logs: 'true'
        networks:
            - sail
        depends_on:
            - redis
            - mailpit
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    loki:
        image: 'grafana/loki:3.7.8'
        command: '-config.file=/etc/loki/local-config.yaml'
        ports:
            - '127.0.0.1:${FORWARD_LOKI_PORT:-3100}:3100'
        volumes:
            - './docker/observability/loki.yaml:/etc/loki/local-config.yaml:ro'
            - 'sail-loki:/loki'
        networks:
            - sail
        restart: unless-stopped
        healthcheck:
            test:
                - CMD
                - /usr/bin/loki
                - -health
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
    alloy:
        image: 'grafana/alloy:v1.20.1'
        command:
            - run
            - '--server.http.listen-addr=0.0.0.0:12345'
            - '--storage.path=/var/lib/alloy/data'
            - /etc/alloy/config.alloy
        ports:
            - '127.0.0.1:${FORWARD_ALLOY_PORT:-12345}:12345'
        volumes:
            - './docker/observability/alloy.alloy:/etc/alloy/config.alloy:ro'
            - '/var/run/docker.sock:/var/run/docker.sock:ro'
            - 'sail-alloy:/var/lib/alloy/data'
        networks:
            - sail
        restart: unless-stopped
        depends_on:
            loki:
                condition: service_healthy
        healthcheck:
            test:
                - CMD
                - bash
                - -c
                - 'exec 3<>/dev/tcp/127.0.0.1/12345'
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
    grafana:
        image: 'grafana/grafana:13.2.2'
        ports:
            - '127.0.0.1:${FORWARD_GRAFANA_PORT:-3000}:3000'
        environment:
            GF_SECURITY_ADMIN_USER: '${GRAFANA_ADMIN_USER:-admin}'
            GF_SECURITY_ADMIN_PASSWORD: '${GRAFANA_ADMIN_PASSWORD:-admin}'
            GF_USERS_ALLOW_SIGN_UP: 'false'
        volumes:
            - './docker/observability/grafana/datasources/loki.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro'
            - './docker/observability/grafana/dashboards/security.yaml:/etc/grafana/provisioning/dashboards/security.yaml:ro'
            - './docker/observability/grafana/dashboard-definitions:/etc/grafana/dashboards:ro'
            - 'sail-grafana:/var/lib/grafana'
        networks:
            - sail
        restart: unless-stopped
        depends_on:
            loki:
                condition: service_healthy
        healthcheck:
            test:
                - CMD-SHELL
                - 'wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1'
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
networks:
    sail:
        driver: bridge
volumes:
    sail-redis:
        driver: local
    sail-loki:
        driver: local
    sail-alloy:
        driver: local
    sail-grafana:
        driver: local
